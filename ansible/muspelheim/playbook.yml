---
- name: Set up Muspelheim AI VM
  hosts: muspelheim
  become: true
  gather_facts: true
  vars:
    ai_base: /opt/ai
    open_webui_port: 3000
    ollama_port: 11434

  tasks:
    # --- Prerequisites ---
    - name: Install prerequisites
      apt:
        name: [ca-certificates, curl, ubuntu-drivers-common]
        state: present
        update_cache: true

    # --- NVIDIA Drivers ---
    - name: Install NVIDIA drivers
      shell: ubuntu-drivers autoinstall
      args:
        creates: /usr/bin/nvidia-smi
      register: nvidia_driver_install

    - name: Reboot after NVIDIA driver install
      reboot:
        reboot_timeout: 120
      when: nvidia_driver_install.changed

    # --- Docker ---
    - name: Create apt keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      shell: curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc

    - name: Add Docker apt repository
      shell: |
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" \
          > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker CE
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    # --- NVIDIA Container Toolkit ---
    - name: Add NVIDIA container toolkit GPG key
      shell: |
        curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey \
          | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
      args:
        creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg

    - name: Add NVIDIA container toolkit apt repository
      shell: |
        curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list \
          | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' \
          > /etc/apt/sources.list.d/nvidia-container-toolkit.list
      args:
        creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list

    - name: Install nvidia-container-toolkit
      apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: true

    - name: Configure Docker NVIDIA runtime
      shell: nvidia-ctk runtime configure --runtime=docker
      args:
        creates: /etc/docker/daemon.json
      notify: Restart Docker

    # --- Ollama ---
    - name: Install Ollama
      shell: curl -fsSL https://ollama.com/install.sh | sh
      args:
        creates: /usr/local/bin/ollama

    - name: Create Ollama systemd override directory
      file:
        path: /etc/systemd/system/ollama.service.d
        state: directory
        mode: "0755"

    - name: Configure Ollama to listen on all interfaces
      copy:
        content: |
          [Service]
          Environment="OLLAMA_HOST=0.0.0.0"
        dest: /etc/systemd/system/ollama.service.d/override.conf
        mode: "0644"
      notify:
        - Reload systemd
        - Restart Ollama

    - name: Enable and start Ollama
      systemd:
        name: ollama
        enabled: true
        state: started
        daemon_reload: true

    # --- Open WebUI ---
    - name: Create AI stack directory
      file:
        path: "{{ ai_base }}"
        state: directory
        mode: "0755"

    - name: Deploy Open WebUI docker-compose
      template:
        src: templates/docker-compose.yml.j2
        dest: "{{ ai_base }}/docker-compose.yml"
        mode: "0644"

    - name: Start Open WebUI stack
      shell: /usr/bin/docker compose up -d
      args:
        chdir: "{{ ai_base }}"

  handlers:
    - name: Restart Docker
      systemd:
        name: docker
        state: restarted

    - name: Reload systemd
      systemd:
        daemon_reload: true

    - name: Restart Ollama
      systemd:
        name: ollama
        state: restarted
